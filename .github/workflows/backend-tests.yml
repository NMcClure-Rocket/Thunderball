name: Backend Tests

on:
  push:
    branches: [ main, dev, 'feat-**' ]
  pull_request:
    branches: [ main, dev, 'feat-**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      run: |
        COUNT=$(pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= test)')
        if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
          echo "::warning::No backend tests found. Add tests to tests/backend/"
        else
          pytest tests/ --cov=api --cov-report=xml --cov-report=term
        fi
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: success() && hashFiles('backend/coverage.xml') != ''
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
